# ============================================================
# Anker MAX AC – Optimalsteuerung neben SolarEdge + LG Chem
# Reine Home-Assistant-Lösung (Helper + Template-Sensoren +
# Automation) - ohne Node-RED.
#
# Bereits mit den echten Entity-IDs dieser Installation befüllt:
#   - SolarEdge Modbus Multi (Zähler M1, Batterie B1 = LG Chem)
#   - Anker SOLIX Solarbank Max AC (Integration ha-anker-solix),
#     Steuerung über den nativen "Drittanbieter-Steuerung"-Modus
#     (Richtung charge/discharge + Ziel-Watt über "Netzleistung")
#
# Installation:
#   1. In configuration.yaml sicherstellen, dass Packages aktiv sind:
#        homeassistant:
#          packages: !include_dir_named packages
#   2. Diese Datei nach <config>/packages/anker_max_control.yaml legen.
#   3. Einmalig im Anker-Gerät (App oder HA-Steuerelemente) die
#      SOC-Schutzgrenzen setzen: Entladegrenze = 10 %, Ladeobergrenze = 95 %
#      (siehe min_soc/max_soc unten - sollten übereinstimmen).
#   4. Home Assistant neu starten (Packages werden nicht durch
#      "YAML neu laden" übernommen, nur durch einen Neustart).
#   5. `grid_power_sign` unten nach dem ersten Praxistest prüfen (siehe
#      Kommentar dort) und bei Bedarf auf -1 stellen.
#
# Siehe README.md für Details zur Logik, Parametern und Fehlersuche.
# ============================================================

input_datetime:
  anker_control_last_command:
    name: "Anker Control: Letzter Befehl"
    has_date: true
    has_time: true

input_text:
  anker_control_last_action:
    name: "Anker Control: Letzte Aktion"
    initial: "idle"

input_number:
  anker_control_last_power:
    name: "Anker Control: Zuletzt gesendete Zielleistung"
    min: 0
    max: 10000
    step: 1
    unit_of_measurement: "W"

template:
  - trigger:
      - trigger: time_pattern
        seconds: "/30"
    variables:
      # ---------- Entity-IDs dieser Installation ----------
      grid_power_entity: sensor.solaredge_i1_m1_ac_power
      lg_soc_entity: sensor.solaredge_i1_b1_state_of_energy
      lg_power_entity: sensor.solaredge_i1_b1_dc_power   # + = LG Chem lädt, - = LG Chem entlädt
      anker_soc_entity: sensor.anker_solix_solarbank_max_ac_soc
      # + = Bezug / - = Einspeisung erwartet. Bei dieser Installation liefert
      # der Sensor umgekehrtes Vorzeichen (negativ = Bezug, positiv =
      # Einspeisung) - per Praxistest am 30.07.2026 bestätigt, daher -1.
      grid_power_sign: -1

      # ---------- Grenzwerte / Verhalten (bei Bedarf anpassen) ----------
      min_soc: 10                 # % - nie unter diesen Wert entladen (Zellschutz)
      max_soc: 95                 # % - nie über diesen Wert laden (Zellschutz)
      lg_full_soc: 95             # % - ab hier gilt LG Chem als "voll genug"
      lg_empty_soc: 10            # % - ab hier gilt LG Chem als "leer"
      lg_idle_power_w: 50         # W - LG Chem gilt erst als gesättigt, wenn Lade-/Entladeleistung unter diesem Wert liegt
      deadband_w: 60              # W - Totband gegen Flattern
      max_charge_power: 1200      # W - siehe Datenblatt Anker MAX AC
      max_discharge_power: 1800   # W - siehe Datenblatt Anker MAX AC

      # ---------- Berechnung (nicht anpassen) ----------
      grid_power_raw: "{{ states(grid_power_entity) | float(0) }}"
      grid_power: "{{ grid_power_raw * grid_power_sign }}"
      lg_soc: "{{ states(lg_soc_entity) | float(-1) }}"
      lg_power: "{{ states(lg_power_entity) | float(0) }}"
      anker_soc: "{{ states(anker_soc_entity) | float(-1) }}"
      sensors_ok: "{{ states(grid_power_entity) not in ['unknown','unavailable',none] and states(lg_soc_entity) not in ['unknown','unavailable',none] and states(lg_power_entity) not in ['unknown','unavailable',none] and states(anker_soc_entity) not in ['unknown','unavailable',none] }}"
      surplus: "{{ -grid_power }}"
      deficit: "{{ grid_power }}"
      can_charge: "{{ anker_soc < max_soc }}"
      can_discharge: "{{ anker_soc > min_soc }}"
      # LG Chem gilt nur dann als "gesättigt" (voll/leer), wenn zusätzlich zum SOC-Schwellenwert
      # auch die tatsächliche Lade-/Entladeleistung nahe Null ist - sonst lädt/entlädt SolarEdge
      # den Speicher noch aktiv, und der Anker würde unnötig mit ihm konkurrieren.
      lg_saturated_full: "{{ lg_soc >= lg_full_soc and lg_power <= lg_idle_power_w }}"
      lg_saturated_empty: "{{ lg_soc <= lg_empty_soc and lg_power >= -lg_idle_power_w }}"
      action: "{{ 'unavailable' if not sensors_ok else ('charge' if (surplus > deadband_w and lg_saturated_full and can_charge) else ('discharge' if (deficit > deadband_w and lg_saturated_empty and can_discharge) else 'idle')) }}"
      charge_target: "{{ ([surplus, max_charge_power] | min) | round(0) if action == 'charge' else 0 }}"
      discharge_target: "{{ ([deficit, max_discharge_power] | min) | round(0) if action == 'discharge' else 0 }}"
    sensor:
      - name: "Anker Control Aktion"
        unique_id: anker_control_aktion
        state: "{{ action }}"
        icon: "{{ 'mdi:battery-charging' if action == 'charge' else ('mdi:battery-arrow-down' if action == 'discharge' else ('mdi:alert-circle' if action == 'unavailable' else 'mdi:battery-heart-variant')) }}"
        attributes:
          grid_power_w: "{{ grid_power | round(0) }}"
          lg_soc: "{{ lg_soc }}"
          lg_power_w: "{{ lg_power | round(0) }}"
          lg_saturated_full: "{{ lg_saturated_full }}"
          lg_saturated_empty: "{{ lg_saturated_empty }}"
          anker_soc: "{{ anker_soc }}"
          can_charge: "{{ can_charge }}"
          can_discharge: "{{ can_discharge }}"
      - name: "Anker Control Ladeleistung Soll"
        unique_id: anker_control_ladeleistung_soll
        unit_of_measurement: "W"
        state_class: measurement
        state: "{{ charge_target }}"
      - name: "Anker Control Entladeleistung Soll"
        unique_id: anker_control_entladeleistung_soll
        unit_of_measurement: "W"
        state_class: measurement
        state: "{{ discharge_target }}"

automation:
  - id: anker_control_apply
    alias: "Anker Control: Entscheidung anwenden"
    description: >-
      Setzt beim Anker MAX AC den Drittanbieter-Steuermodus sowie Richtung
      (charge/discharge) und Ziel-Watt ("Netzleistung"), sobald sich die
      berechnete Zielaktion relevant ändert (mit Hysterese, Mindestabstand
      zwischen Cloud-Befehlen und Sicherheits-Override bei SOC-Grenzen).
    trigger:
      - trigger: time_pattern
        seconds: "/30"
    condition: []
    mode: single
    action:
      - variables:
          action: "{{ states('sensor.anker_control_aktion') }}"
          can_charge_now: "{{ state_attr('sensor.anker_control_aktion', 'can_charge') }}"
          can_discharge_now: "{{ state_attr('sensor.anker_control_aktion', 'can_discharge') }}"
          charge_target: "{{ states('sensor.anker_control_ladeleistung_soll') | float(0) }}"
          discharge_target: "{{ states('sensor.anker_control_entladeleistung_soll') | float(0) }}"
          target_direction: "{{ 'charge' if action == 'charge' else 'discharge' }}"
          target_power: "{{ charge_target if action == 'charge' else (discharge_target if action == 'discharge' else 0) }}"
          prev_action: "{{ states('input_text.anker_control_last_action') }}"
          prev_power: "{{ states('input_number.anker_control_last_power') | float(0) }}"
          last_cmd_ts: "{{ states('input_datetime.anker_control_last_command') }}"
          seconds_since_last: "{{ now().timestamp() - (last_cmd_ts | as_timestamp(0)) }}"
          action_changed: "{{ action != prev_action }}"
          significant_change: "{{ (target_power - prev_power) | abs >= 50 }}"
          due_for_refresh: "{{ seconds_since_last >= 600 }}"
          min_interval_ok: "{{ seconds_since_last >= 90 }}"
          safety_override: "{{ (prev_action == 'discharge' and not can_discharge_now) or (prev_action == 'charge' and not can_charge_now) }}"
          should_send: "{{ action != 'unavailable' and (safety_override or ((action_changed or significant_change or due_for_refresh) and min_interval_ok)) }}"
      - if:
          - condition: template
            value_template: "{{ action == 'unavailable' }}"
        then:
          - service: persistent_notification.create
            data:
              title: "Anker-Steuerung"
              message: "Pflicht-Sensor(en) nicht verfügbar - keine Aktion ausgeführt."
              notification_id: anker_control_error
        else:
          - service: persistent_notification.dismiss
            data:
              notification_id: anker_control_error
      - if:
          - condition: template
            value_template: "{{ should_send }}"
        then:
          - service: select.select_option
            target:
              entity_id: select.anker_solix_solarbank_max_ac_betriebsmodus_gerat_lauft_im_drittanbieter_steuermodus
            data:
              option: "third_party_control"
          - service: select.select_option
            target:
              entity_id: select.anker_solix_solarbank_max_ac_leistungsfluss
            data:
              option: "{{ target_direction }}"
          - service: number.set_value
            target:
              entity_id: number.anker_solix_solarbank_max_ac_netzleistung
            data:
              value: "{{ target_power }}"
          - service: input_text.set_value
            target:
              entity_id: input_text.anker_control_last_action
            data:
              value: "{{ action }}"
          - service: input_number.set_value
            target:
              entity_id: input_number.anker_control_last_power
            data:
              value: "{{ target_power }}"
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.anker_control_last_command
            data:
              timestamp: "{{ now().timestamp() }}"
